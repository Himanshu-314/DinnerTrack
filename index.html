<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinner Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f6f5c">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ec;--surface:#fff;--ink:#1d2b26;--muted:#5d6b65;--line:#d3dad4;--on:#1f6f5c;--on-bg:#dcefe8;--off:#b23a5b;--off-bg:#f6dde4;--accent:#1f6f5c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a17;--surface:#1b2622;--ink:#e6efe9;--muted:#93a39b;--line:#2d3b35;--on:#5fc4a6;--on-bg:#1f3a31;--off:#ef7c9a;--off-bg:#432431;--accent:#5fc4a6}}
:root[data-theme="dark"]{--bg:#121a17;--surface:#1b2622;--ink:#e6efe9;--muted:#93a39b;--line:#2d3b35;--on:#5fc4a6;--on-bg:#1f3a31;--off:#ef7c9a;--off-bg:#432431;--accent:#5fc4a6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.9rem;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.add{display:flex;gap:8px;margin-bottom:20px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.add input{flex:1}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 16px;background:var(--accent);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:400}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fields label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px}
.fields input{width:100%}
.bill{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.total{font-size:2.8rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.calc{color:var(--muted);font-size:.95rem}
.stats{display:flex;gap:16px;margin-top:10px;font-size:.95rem}
.stats b{font-weight:600}
.on-t{color:var(--on)}.off-t{color:var(--off)}
.month{font-weight:600;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{font-size:.75rem;color:var(--muted);text-align:center}
.day{aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:var(--on-bg);color:var(--on);font:inherit;font-weight:600;cursor:pointer;padding:0}
.day.skip{background:var(--off-bg);color:var(--off);text-decoration:line-through;border-color:var(--off)}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:8px;margin-top:14px}
.empty{color:var(--muted);text-align:center;padding:32px 0}
.all{color:var(--muted);font-size:.9rem;text-align:center}
@media (max-width:420px){.fields{grid-template-columns:1fr 1fr}.fields label:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<main>
  <h1>Dinner tracker</h1>
  <p class="sub">Every day in the period counts as a meal. Tap a day to skip it.</p>
  <div class="add">
    <input id="newName" type="text" placeholder="Add a person" aria-label="Person's name" maxlength="30">
    <button class="btn" data-act="add">Add person</button>
  </div>
  <div id="app"></div>
</main>
<script>
var KEY='dinner-tracker-v1',S={users:[],active:null};
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var money=function(n){return '₹'+n.toLocaleString('en-IN')};
function newUser(name){var n=new Date();return{id:'u'+Date.now(),name:name,start:iso(new Date(n.getFullYear(),n.getMonth(),1)),end:iso(new Date(n.getFullYear(),n.getMonth()+1,0)),rate:100,skipped:[]}}
function daysOf(u){var a=parse(u.start),b=parse(u.end),out=[];if(!u.start||!u.end||b<a)return out;
  for(var d=new Date(a);d<=b&&out.length<400;d.setDate(d.getDate()+1))out.push(new Date(d));return out}
function calc(u){var ds=daysOf(u),set=new Set(u.skipped),sk=ds.filter(function(d){return set.has(iso(d))}).length;
  return{total:ds.length,skipped:sk,billed:ds.length-sk,amount:(ds.length-sk)*u.rate}}
function cur(){return S.users.find(function(u){return u.id===S.active})||S.users[0]}
var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function calendar(u){var ds=daysOf(u);if(!ds.length)return '<div class="empty">Choose an end date on or after the start date.</div>';
  var set=new Set(u.skipped),html='<div class="grid">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(w){return '<div class="wd">'+w+'</div>'}).join('')+'</div>',i=0;
  while(i<ds.length){var m=ds[i].getMonth(),y=ds[i].getFullYear(),g='<div class="month">'+MN[m]+' '+y+'</div><div class="grid">';
    g+='<div></div>'.repeat((ds[i].getDay()+6)%7);
    while(i<ds.length&&ds[i].getMonth()===m){var k=iso(ds[i]),s=set.has(k);
      g+='<button class="day'+(s?' skip':'')+'" data-act="day" data-d="'+k+'" aria-pressed="'+s+'" aria-label="'+ds[i].getDate()+' '+MN[m]+(s?', skipped':', subscribed')+'">'+ds[i].getDate()+'</button>';i++}
    html+=g+'</div>'}
  return html}
function render(){var app=document.getElementById('app');
  if(!S.users.length){app.innerHTML='<div class="empty">Add your first person above to start tracking dinners.</div>';return}
  var u=cur(),c=calc(u);S.active=u.id;
  var all=S.users.reduce(function(a,x){return a+calc(x).amount},0);
  app.innerHTML='<div class="tabs" role="group" aria-label="People">'+S.users.map(function(x){return '<button class="tab" data-act="pick" data-id="'+x.id+'" aria-pressed="'+(x.id===u.id)+'">'+esc(x.name)+'</button>'}).join('')+'</div>'
  +'<div class="panel"><div class="fields">'
  +'<label>Billing starts<input type="date" data-f="start" value="'+u.start+'"></label>'
  +'<label>Billing ends<input type="date" data-f="end" value="'+u.end+'"></label>'
  +'<label>Price per dinner (₹)<input type="number" min="0" data-f="rate" value="'+u.rate+'"></label></div></div>'
  +'<div class="panel"><div class="bill"><div><div class="calc">Amount due for '+esc(u.name)+'</div><div class="total">'+money(c.amount)+'</div></div>'
  +'<div class="calc">'+c.billed+' × '+money(u.rate)+'</div></div>'
  +'<div class="stats"><span><b>'+c.total+'</b> days</span><span class="on-t"><b>'+c.billed+'</b> subscribed</span><span class="off-t"><b>'+c.skipped+'</b> skipped</span></div></div>'
  +'<div class="legend"><span class="on-t">Subscribed</span><span class="off-t">Skipped (tap again to undo)</span></div>'
  +calendar(u)
  +'<div class="row"><button class="btn ghost" data-act="reset">Mark all subscribed</button><button class="btn ghost" data-act="del">Remove '+esc(u.name)+'</button></div>'
  +(S.users.length>1?'<p class="all">Everyone together: '+money(all)+'</p>':'')}
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,u=cur();
  if(a==='add')addUser();
  else if(a==='pick')S.active=b.dataset.id;
  else if(a==='day'){var i=u.skipped.indexOf(b.dataset.d);if(i<0)u.skipped.push(b.dataset.d);else u.skipped.splice(i,1)}
  else if(a==='reset'){u.skipped=[]}
  else if(a==='del'){if(!confirm('Remove '+u.name+' and all their records?'))return;S.users=S.users.filter(function(x){return x.id!==u.id});S.active=null}
  save();render()});
document.addEventListener('change',function(e){var f=e.target.dataset.f;if(!f)return;var u=cur();
  u[f]=f==='rate'?Math.max(0,Number(e.target.value)||0):e.target.value;save();render()});
function addUser(){var inp=document.getElementById('newName'),n=inp.value.trim();if(!n)return;var u=newUser(n);S.users.push(u);S.active=u.id;inp.value=''}
document.getElementById('newName').addEventListener('keydown',function(e){if(e.key==='Enter'){addUser();save();render()}});
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
